        - name: fields
          in: query
          description: '확장. `map` = 지도 그리기에 드는 7필드만(전 세계 gzip 0.47 MB), `full` = 칸 필드 전부(gzip 0.65 MB). 잰 값은 위 설명.'
          schema: {type: string, enum: [map, full], default: full}
        - $ref: '#/components/parameters/Format'
