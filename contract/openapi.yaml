  /cells/frp:
    get:
      tags: [observation]
      operationId: listCellFrp
      summary: 불 세기 FRP (S-NPP 환산, 0.1° 칸 × 일 또는 월)
      description: |
        `harmonized_cell_day_frp.parquet`(97,791,096행, 800 row group — 2026-11-15 팀 시험 서버에서 parquet 메타로 잼). 전 세계, `date_local` 2000-11-01 ~ 2026-11-15.
        - 파일 열(잼): `cell_id` int64 · `date_local` date32 · `frp_sum` double · `frp_snpp_equiv_sum` double · `frp_snpp_equiv_max` float · `n_points` int32 (6열, null 0).
          **위경도 열이 없다** → `cell_lat/lon` 은 서버가 CellId 식으로 붙인다(칸 중심). 응답 `date` = `date_local`(현지 날짜, 2026-11-15 은 UTC 보다 앞선 시간대의 날).
        - 화면 값 = `frp_snpp_equiv_sum` / `frp_snpp_equiv_max`. `frp_sum` 은 원 FRP(참고). 기준 점(고정 열원 제외)만으로 만든 값.
        - 파일 통계에 `-0.0` 이 있다(최솟값) → 직렬화는 0 으로 낸다. 첫 5행 표본에 `frp_sum` 0.0 · `n_points` 1 인 행이 있었다(작은 값이 표시만 0 인지는 안 쟀다) — 값 0 인 행은 「행 없음」과 다르게 그린다.
        - 파일은 `cell_id` 순이고 row group 마다 날짜가 전 기간에 걸친다(잼) → 날짜·상자 조회는 파일 직접 읽기로 못 하고 적재 때 (date_local, cell_id) 색인이 필요하다.
        - 전 세계 하루 ≈ 14,896행(2025-03-20~31 평균, 잼) — bbox 없이 하루치를 주는 것도 50,000행 한도 안이지만, 넓이 한도로 막는다(아래).
        - `freq=day` = 파일 행 그대로. `freq=month` = 칸·달로 묶음(합 = Σ, 최대 = max, `n_points` = Σ) — 우리가 묶는 집계(값 재계산 아님).
        - 행 없는 칸·날 = 기준 점 감지 없음(FRP 없음). 「0 MW」로 칠하지 않고 비운다.
        - 한도: 응답 행(칸 × 기간 추정) ≤ 50,000, 일 단위 기간 ≤ 31일, 월 단위 ≤ 24개월, bbox 넓이 ≤ 100 deg² — 넘으면 400 `range_too_large`.
        - 한계 문구(모델팀): Terra 밤 비율(2.41) 신뢰 낮음, 2000~2011 MODIS 는 2012 이후 비율 사용(가정).
      x-handoff-alias: null
      x-release-file: harmonized_cell_day_frp.parquet
      parameters:
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/AoiIdQuery'
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - name: freq
          in: query
          schema: {type: string, enum: [day, month], default: day}
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: 칸 FRP
          headers: *layer_cached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CellFrpList'
            text/csv:
              schema:
                type: string
                x-csv-columns: [cell_id, cell_lat, cell_lon, date, frp_sum, frp_snpp_equiv_sum, frp_snpp_equiv_max, n_points]
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  headers:
    ETag:
      description: 판 + 협상된 미디어 타입 + 정규화한 질의의 해시. If-None-Match 가 같으면 304.
      schema: {type: string}
    CacheControlData:
      description: |
        데이터 경로 = `public, max-age=0, must-revalidate` (판 교체·롤백이 다음 요청에 바로 보이고 304 로 전송량을 아낌 — arch2 §3.8, critique D6).
        로그인 경로 `private, no-store`. 오류 `no-store`. 정적 자산만 immutable.
        시제품 v3 는 완료 달 86400 · nrt/partial 섞임 300 · /aoi·/method 3600 을 낸다(MAPPING §5 — 정본과 다름).
      schema:
        type: string
        examples: ['public, max-age=0, must-revalidate']
    XMethodVersion:
      description: 데이터 판(API 판 아님). 본문 method_version 과 같다.
      required: true
      schema:
        $ref: '#/components/schemas/MethodVersion'
    XDataVersion:
      description: 적재한 파일 묶음의 식별자(적재 시각 + 해시 앞 12자리). 예 `2026-11-14T10:11:40Z#726b884a5ec1`.
      schema: {type: string}
    Vary:
      schema:
        type: string
        const: Accept, Accept-Language
    CacheControlLayer:
      description: |
        v1.2 새 층(release 고정 자료) = `public, max-age=0, s-maxage=3600, must-revalidate`.
        - 브라우저는 매번 재검증(ETag → 304, 판 교체가 바로 보임 — 데이터 경로 규칙과 같음).
        - 공유 캐시(Cloudflare 무료 플랜 엣지·nginx proxy_cache)는 1시간 보관 → 원 서버(팀 K3s) 부하를 줄인다. 판 교체 때 캐시 키에 `X-Data-Version` 을 넣거나 퍼지.
        - 서버 안: Redis 캐시 키 = data_version + 정규화 질의, TTL 없음(판이 바뀌면 키가 바뀜). `/occurrence/grid` 전 세계·`/occurrence/aois?parent_id=KR` 는 적재 때 미리 직렬화.
        - 오류는 `no-store`.
      schema:
        type: string
        examples: ['public, max-age=0, s-maxage=3600, must-revalidate']
    RetryAfter:
      description: 초 단위 정수
      schema: {type: integer, minimum: 1}
    CacheControlNoStore:
      schema:
        type: string
        const: no-store
  parameters:
    AoiIdPath:
      name: aoiId
      in: path
      required: true
      description: '`aoi_list.aoi_id`. 핸드오프 쿼리 이름은 `aoi_id`.'
      schema:
        $ref: '#/components/schemas/AoiId'
      examples:
        korea: {value: KR}
        gyeongbuk: {value: SIDO_47}
        andong: {value: SGG_47170}
    AoiIdQuery:
      name: aoi_id
      in: query
      description: '`bbox` 와 정확히 하나(둘 다·둘 다 없음 → 400 invalid_param). 점은 그 점의 cell_id 가 AOI 칸인지로 거른다(G5).'
      schema:
        $ref: '#/components/schemas/AoiId'
    Bbox:
      name: bbox
      in: query
      description: '서,남,동,북 (WGS84). `aoi_id` 와 정확히 하나.'
      style: form
      explode: false
      schema:
        $ref: '#/components/schemas/Bbox'
    BboxRequired:
      name: bbox
      in: query
      required: true
      description: '서,남,동,북 (WGS84)'
      style: form
      explode: false
      schema:
        $ref: '#/components/schemas/Bbox'
    BboxOptional:
      name: bbox
      in: query
      description: '서,남,동,북 (WGS84). 없으면 전체. 날짜 변경선을 넘는 상자(서 > 동)는 받는다(모델팀 store 규칙).'
      style: form
      explode: false
      schema:
        $ref: '#/components/schemas/Bbox'
    Level:
      name: level
      in: query
      schema:
        $ref: '#/components/schemas/AoiLevel'
    ParentId:
      name: parent_id
      in: query
      description: 없는 id 면 404 unknown_aoi
      schema:
        $ref: '#/components/schemas/AoiId'
    Q:
      name: q
      in: query
      description: 이름(name_ko·name_en)·aoi_id 부분 일치, 대소문자 무시
      schema: {type: string, maxLength: 100}
    IncludeHidden:
      name: include_hidden
      in: query
      schema: {type: boolean, default: false}
    ListLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
    Cursor:
      name: cursor
      in: query
      description: 불투명 keyset 커서. 판이 바뀐 커서는 409 cursor_stale.
      schema: {type: string, maxLength: 512}
    StartYear:
      name: start_year
      in: query
      description: 기본 = 그 AOI 자료의 첫 해. end_year − start_year ≤ 40.
      schema: {type: integer, minimum: 2000, maximum: 2100}
    EndYear:
      name: end_year
      in: query
      description: 기본 = 그 AOI 자료의 끝 해
      schema: {type: integer, minimum: 2000, maximum: 2100}
    Start:
      name: start
      in: query
      required: true
      description: YYYY-MM-DD (date_local 기준). start > end → 400.
      schema: {type: string, format: date}
    End:
      name: end
      in: query
      required: true
      schema: {type: string, format: date}
    Freq:
      name: freq
      in: query
      description: day 는 ≤ 366일, month 는 ≤ 40년
      schema:
        type: string
        enum: [month, day]
        default: month
    Format:
      name: format
      in: query
      description: '브라우저 링크용. csv = `Accept: text/csv` 와 같다. 동기 CSV ≤ 100,000행(넘으면 400 range_too_large 30102).'
      schema:
        type: string
        enum: [json, csv]
  responses:
    SummaryOk:
      description: 기간별 합계
      headers: *cached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Summary'
          examples:
            kr_2025_q1:
              summary: GET /aois/KR/summary?start=2025-01-01&end=2025-03-31&freq=month (release 실값, 3월만 남김)
              value:
                aoi_id: KR
                start: '2025-01-01'
                end: '2025-03-31'
                freq: month
                unit: VIIRS(S-NPP) 기준 화재 감지량
                series:
                  - date: '2025-03-01'
                    year: 2025
                    month: 3
                    value: 2764.0
                    value_lo: 2764.0
                    value_hi: 2764.0
                    value_source: snpp_observed
                    data_source: SP
                    status: ok
                    missing_dates: []
                    flags: []
                    basis: aoi_month
                total: {value: 2837.0, value_lo: 2837.0, value_hi: 2837.0, n_missing: 0, n_out_of_range: 0}
                method_version: v1-m2v-2026-11-14
        text/csv:
          schema:
            type: string
            x-csv-columns: [area, date, value, value_lo, value_hi, value_source, data_source, status, missing_dates, freq, method_version]
    MethodOk:
      description: 방법 설명
      headers: *cached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Method'
    NotModified:
      description: If-None-Match 일치
    BadRequest:
      description: 입력 오류 (invalid_param · range_too_large · polygon_too_complex)
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid_param:
              summary: GET /aois/KR/calendar?start_year=abc (시제품 응답 + 정본 멤버 error_no·instance)
              value:
                type: https://emberline.example/errors/invalid_param
                title: Invalid parameter
                status: 400
                code: invalid_param
                error_no: 10001
                param: start_year
                detail: start_year must be an integer
                instance: /api/v1/aois/KR/calendar
                request_id: 38ESHBPJ5SNS
                method_version: v1-m2v-2026-11-14
    NotFound:
      description: 없는 aoi_id · 경로
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unknown_aoi:
              value:
                type: https://emberline.example/errors/unknown_aoi
                title: Unknown area
                status: 404
                code: unknown_aoi
                error_no: 20401
                param: aoi_id
                detail: aoi_id NOPE is not in aoi_list
                instance: /api/v1/aois/NOPE/calendar
                request_id: 38ESHBPJKXRB
                method_version: v1-m2v-2026-11-14
    NotAcceptable:
      description: 지원 안 하는 Accept
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: cursor_stale (판이 바뀐 커서)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: '본문 > 256 KB (POST /forecast 는 > 64 KB, 10102 BODY_TOO_LARGE)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 레이트 리밋
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: FIRMS 상류 오류 (본문 버림)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: |
        data_not_loaded (판·파일 없음 — 경로 단위) · overloaded · upstream_unavailable.
        이 release 로는 `/hotspots`·일 단위·bbox·polygon 합계·`/satellite-status` 가 503.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            sds_absent:
              summary: GET /satellite-status (시제품 응답 + error_no·instance)
              value:
                type: https://emberline.example/errors/data_not_loaded
                title: Model outputs not loaded
                status: 503
                code: data_not_loaded
                error_no: 50501
                detail: satellite_day_status is not provided yet
                instance: /api/v1/satellite-status
                request_id: 38ESHBPH84F9
                method_version: v1-m2v-2026-11-14
  schemas:
    MethodVersion:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
      examples: [v1-m2v-2026-11-14]
    Unit:
      type: string
      const: VIIRS(S-NPP) 기준 화재 감지량
      description: 「산불 건수」가 아니다(핸드오프 §4.4).
    AoiId:
      type: string
      pattern: '^[A-Za-z0-9_:.\-]{1,64}$'
      description: |
        release 실값 모양 — `WORLD`(대문자), `CONT_<영문>`(예 `CONT_Asia`), 나라 `ADM0_<ISO3>`(한국만 예외 `KR`, `ADM0_KOR` 없음),
        `ADM1_<ISO3>-<n>`, `SIDO_<2자리>`(17개, 강원 51·전북 52), `SGG_<5자리>`(252개, 군위 = `SGG_27720` 부모 SIDO_27).
        확장 `group:gb-north`(경북 북부 11 시군 — release 에 행 없음, 목업은 11 SGG 합으로 파생).
      examples: [KR, WORLD, CONT_Asia, ADM0_ARG, ADM1_AFG-1741, SIDO_47, SGG_47170, SGG_27720]
    AoiLevel:
      type: string
      enum: [world, continent, country, adm1, kr_sido, kr_sgg, group]
      description: |
        핸드오프 값. release `aoi_list.level` 은 `world/continent/country/adm1/kr/sido/sgg` 이고 적재기가 번역한다.
        개수(release): adm1 4,524 · sgg 252 · country 248 · sido 17 · continent 8 · world 1 · kr 1. `group` 은 확장.
      x-release-values:
        kr: country
        sido: kr_sido
        sgg: kr_sgg
    YearMonth:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    Bbox:
      type: array
      description: '[서, 남, 동, 북]. 서 < 동, 남 < 북, 경도 ±180, 위도 ±90.'
      minItems: 4
      maxItems: 4
      items: {type: number}
    ValueSource:
      type: string
      enum: [modis_m2v_terra, modis_m2v, snpp_observed, n20_bridge, n21_bridge]
      description: |
        값의 출처. 달 단위 경계(release 실측): terra 2000-11~2002-06 · modis_m2v 2002-07~**2012-01** · snpp 2012-02~2026-10 · n20_bridge 2026-11(NOAA-20 × 1.013, 핸드오프 §3).
        `n21_bridge`(NOAA-20 결측일 × 1.053)는 release 0행이지만 핸드오프 코드값이라 계약에 남긴다.
        v0 이름(`modis_harmonized`, `noaa20_bridged`, `modis_harmonized_terra_only`)은 적재기만 받고 응답에는 안 나온다.
      x-release-rows:
        harmonized_cell_month: {modis_m2v: 25124932, snpp_observed: 22517158, modis_m2v_terra: 3828671, n20_bridge: 91881, n21_bridge: 0}
        aoi_month: {snpp_observed: 894027, modis_m2v: 580865, modis_m2v_terra: 101020, n20_bridge: 5051, n21_bridge: 0}
    DataSource:
      type: string
      enum: [SP, NRT]
      description: SP 정식 / NRT 빠른 처리본(release 2026-08~11). 점 파일에서는 열 이름 `source`.
    MonthStatus:
      type: string
      enum: [ok, nrt, partial, missing, out_of_range]
      description: |
        파일 값 4종(ok · nrt · partial · missing) + 응답 전용 확장 `out_of_range`(파일에 행이 없는 달·날).
        `low_sample` 은 status 가 아니라 불린 필드(arch2 X1 — 모델팀 확정 필요). `missing` 이면 value null, 0 으로 칠하지 않는다.
        release(aoi_month): ok 1,555,708 · nrt 15,153 (2026-08~10) · missing 5,051 (2001-06) · partial 5,051 (2026-11).
    Verdict:
      type: string
      enum: [above, similar, below, uncertain]
      description: 파일 값 그대로. 기준 분포 = 2001–2025 같은 달·해당 연도 제외·status=ok. 경계 80/20, 비교 연도 < 10 → uncertain.
    Interval:
      type: object
      description: |
        `value` = VIIRS(S-NPP) 기준 감지량, `value_lo`/`value_hi` = 10–90 % 구간.
        - 실측 기간은 lo = value = hi.
        - **value 가 [lo, hi] 밖일 수 있다**: release 칸 표 441,269행(전부 modis_m2v, 점 추정 모델과 구간 모델이 따로 — 추론). 클라이언트는 value 를 구간 안으로 자르지 않는다.
        - 칸 표의 `modis_m2v_terra` 행은 lo·hi null(3,828,671행, meta `cell_interval` 대로).
        - status=missing 이면 셋 다 null.
      properties:
        value: {type: [number, 'null'], minimum: 0}
        value_lo: {type: [number, 'null'], minimum: 0}
        value_hi: {type: [number, 'null'], minimum: 0}
    Aoi:
      type: object
      additionalProperties: false
      required: [aoi_id, name_ko, name_en, level, parent_id, n_cells, hidden]
      properties:
        aoi_id: {$ref: '#/components/schemas/AoiId'}
        name_ko:
          type: string
          x-release-column: name
          description: release 는 `name` 하나(한국 밖은 영문 이름이 들어 있음, 예 WORLD → "World").
        name_en:
          type: [string, 'null']
          x-release-column: null
          description: release 에 열이 없어 지금은 항상 null (R3).
        level: {$ref: '#/components/schemas/AoiLevel'}
        parent_id:
          type: [string, 'null']
          x-release-column: parent_aoi
        n_cells: {type: integer, minimum: 0}
        hidden: {type: boolean}
        has_data: {type: boolean, description: 확장}
        first_month: {type: [string, 'null'], pattern: '^\d{4}-\d{2}$', description: 확장}
        last_month: {type: [string, 'null'], pattern: '^\d{4}-\d{2}$', description: 확장}
        bbox:
          description: 확장. 경계 없는 AOI 는 null.
          oneOf:
            - $ref: '#/components/schemas/Bbox'
            - type: 'null'
        geometry:
          description: 별칭 `/api/aoi?include_geometry=true` 에서만
          type: [object, 'null']
        method_version:
          $ref: '#/components/schemas/MethodVersion'
          description: 단건(`/aois/{aoiId}`) 응답에만
    AoiList:
      type: object
      additionalProperties: false
      required: [method_version, count, aois]
      properties:
        method_version: {$ref: '#/components/schemas/MethodVersion'}
        unit: {$ref: '#/components/schemas/Unit'}
        count: {type: integer, minimum: 0}
        next_cursor: {type: [string, 'null'], description: 정본 전용(시제품 v3 에는 없음)}
        aois:
          type: array
          items: {$ref: '#/components/schemas/Aoi'}
    BoundaryFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type: {const: Feature}
        geometry:
          type: [object, 'null']
          description: Polygon 또는 MultiPolygon (WGS84). 경계 없는 AOI 13개는 null.
        properties:
          type: object
          required: [aoi_id, method_version]
          properties:
            aoi_id: {$ref: '#/components/schemas/AoiId'}
            method_version: {$ref: '#/components/schemas/MethodVersion'}
    EventColumns:
      type: object
      description: 덩어리 8열 — 확장 선택 열. release 에 없어 지금은 전부 null.
      properties:
        n_events_viirs: {type: [integer, 'null']}
        event_area_max_km2_viirs: {type: [number, 'null']}
        event_days_max_viirs: {type: [integer, 'null']}
        event_area_share_max_viirs: {type: [number, 'null']}
        n_events_modis: {type: [integer, 'null']}
        event_area_max_km2_modis: {type: [number, 'null']}
        event_days_max_modis: {type: [integer, 'null']}
        event_area_share_max_modis: {type: [number, 'null']}
    CalendarMonth:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/Interval'
        - $ref: '#/components/schemas/EventColumns'
      required: [year, month, value, value_lo, value_hi, raw_modis, raw_viirs, value_source, data_source, status, verdict, percentile, ratio_to_median, low_sample]
      properties:
        year: {type: integer, minimum: 2000, maximum: 2100}
        month: {type: integer, minimum: 1, maximum: 12}
        raw_modis: {type: [integer, 'null'], minimum: 0, description: 원래 MODIS 감지 수(참고)}
        raw_viirs: {type: [integer, 'null'], minimum: 0, description: 원래 VIIRS 감지 수(참고). MODIS 기간은 null.}
        value_source: {oneOf: [{$ref: '#/components/schemas/ValueSource'}, {type: 'null'}]}
        data_source: {oneOf: [{$ref: '#/components/schemas/DataSource'}, {type: 'null'}]}
        status: {$ref: '#/components/schemas/MonthStatus'}
        n_cells: {type: [integer, 'null'], minimum: 0}
        verdict: {oneOf: [{$ref: '#/components/schemas/Verdict'}, {type: 'null'}]}
        percentile:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: 파일 값 그대로(반올림 안 함). 중간 순위 백분위.
        ratio_to_median: {type: [number, 'null'], minimum: 0}
        low_sample:
          type: [boolean, 'null']
          description: compare 표의 bool 열(baseline_p75 < 1). true 여도 verdict 가 above 일 수 있다(파일 그대로).
        missing_dates: {type: array, items: {type: string, format: date}, description: 확장}
        days_covered: {type: [integer, 'null'], description: 확장}
    Calendar:
      type: object
      additionalProperties: false
      required: [aoi_id, method_version, unit, start_year, end_year, months]
      properties:
        aoi_id: {$ref: '#/components/schemas/AoiId'}
        method_version: {$ref: '#/components/schemas/MethodVersion'}
        unit: {$ref: '#/components/schemas/Unit'}
        start_year: {type: integer}
        end_year: {type: integer}
        months:
          type: array
          items: {$ref: '#/components/schemas/CalendarMonth'}
        event_columns:
          type: array
          items: {type: string}
          description: 확장. 값이 있는 덩어리 열 이름
    BaselineYear:
      type: object
      additionalProperties: false
      required: [year, value, status, used]
      properties:
        year: {type: integer}
        value: {type: [number, 'null']}
        status: {$ref: '#/components/schemas/MonthStatus'}
        value_source: {oneOf: [{$ref: '#/components/schemas/ValueSource'}, {type: 'null'}]}
        used: {type: boolean, description: 기준 분포에 들어갔는지}
    Comparison:
      type: object
      additionalProperties: false
      required: [aoi_id, year, month, value, baseline_median, baseline_p25, baseline_p75, percentile, ratio_to_median, n_baseline_years, verdict, status, low_sample, method_version]
      properties:
        aoi_id: {$ref: '#/components/schemas/AoiId'}
        year: {type: integer}
        month: {type: integer, minimum: 1, maximum: 12}
        unit: {$ref: '#/components/schemas/Unit'}
        value: {type: [number, 'null'], minimum: 0}
        baseline_median: {type: [number, 'null'], minimum: 0}
        baseline_p25: {type: [number, 'null'], minimum: 0}
        baseline_p75: {type: [number, 'null'], minimum: 0}
        percentile: {type: [number, 'null'], minimum: 0, maximum: 100}
        ratio_to_median: {type: [number, 'null'], minimum: 0}
        n_baseline_years: {type: [integer, 'null'], minimum: 0}
        verdict: {oneOf: [{$ref: '#/components/schemas/Verdict'}, {type: 'null'}]}
        status: {$ref: '#/components/schemas/MonthStatus'}
        value_source: {oneOf: [{$ref: '#/components/schemas/ValueSource'}, {type: 'null'}]}
        value_lo: {type: [number, 'null']}
        value_hi: {type: [number, 'null']}
        low_sample: {type: [boolean, 'null']}
        baseline_period:
          type: string
          enum: ['2001-2025', '2012-2025']
          description: |
            선택(v1.2 2026-11-15~, 옛 응답엔 없음). 이 지역의 같은 달 비교 기준 기간 — `aoi_month_compare.baseline_period` 그대로.
            연속성 점검(`continuity_ratio` 0.85–1.15)을 통과하면 2001-2025, 아니면 2012-2025(VIIRS 시기만).
            2012-2025 지역의 2012년 이전 달과 기준 연수 8년 미만은 `verdict = uncertain`(화면 「판정 보류」).
            예: KR 2012-2025, ADM0_ARG·WORLD 2001-2025. 화면은 이 값을 평년 기간으로 그대로 보여 주고, 없으면 2001–2025 로 둔다.
        continuity_ratio:
          type: [number, 'null']
          minimum: 0
          description: |
            선택. (통합값 2013–2021 ÷ 2003–2011) ÷ (MODIS 원자료 2013–2021 ÷ 2003–2011). 0.85–1.15 → 2001-2025. 파일 값 그대로.
        continuity_source:
          type: string
          pattern: '^(own|parent:.+)$'
          description: |
            선택. `own` = 자기 지역 비율, `parent:<aoi_id>` = 두 기간 MODIS 원자료가 각각 50건 미만이라 상위 지역(시군구 → 시도 → 나라) 비율을 물려받음.
        baseline:
          type: array
          items: {$ref: '#/components/schemas/BaselineYear'}
          description: 확장. 기준 기간(`baseline_period`, 없으면 2001–2025) 중 해당 연도 뺀 해들
        rule:
          type: object
          description: 확장. 판정 규칙 설명(파일 판정을 설명할 뿐 다시 계산하지 않는다)
        derived:
          type: object
          description: 확장. release 에 없는 AOI(group:gb-north)를 하위 합으로 만들었을 때만
        method_version: {$ref: '#/components/schemas/MethodVersion'}
    SummaryPoint:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/Interval'
      required: [date, value, value_lo, value_hi, value_source, status]
      properties:
        date: {type: string, format: date, description: 일 = 그 날, 월 = 그 달 1일}
        year: {type: integer, description: 확장(월)}
        month: {type: integer, description: 확장(월)}
        value_source: {oneOf: [{$ref: '#/components/schemas/ValueSource'}, {type: 'null'}]}
        data_source: {oneOf: [{$ref: '#/components/schemas/DataSource'}, {type: 'null'}]}
        status: {$ref: '#/components/schemas/MonthStatus'}
        missing_dates: {type: array, items: {type: string, format: date}}
        flags: {type: array, items: {type: string, enum: [partial_range]}}
        basis: {type: string, enum: [aoi_month, hotspots]}
    Summary:
      type: object
      additionalProperties: false
      required: [start, end, freq, series, method_version]
      properties:
        aoi_id: {$ref: '#/components/schemas/AoiId'}
        bbox: {$ref: '#/components/schemas/Bbox'}
        polygon_hash: {type: string, description: polygon 요청일 때 정규화 geometry 의 sha256 앞 16자}
        start: {type: string, format: date}
        end: {type: string, format: date}
        freq: {type: string, enum: [month, day]}
        unit: {$ref: '#/components/schemas/Unit'}
        series:
          type: array
          items: {$ref: '#/components/schemas/SummaryPoint'}
        total:
          type: object
          additionalProperties: false
          properties:
            value: {type: [number, 'null']}
            value_lo: {type: [number, 'null']}
            value_hi: {type: [number, 'null']}
            n_missing: {type: integer}
            n_out_of_range: {type: integer}
        method_version: {$ref: '#/components/schemas/MethodVersion'}
    SummaryQuery:
      type: object
      additionalProperties: false
      required: [polygon, start, end]
      properties:
        polygon:
          type: object
          description: GeoJSON Polygon·MultiPolygon(또는 그 Feature). 꼭짓점 ≤ 5,000, 링 ≤ 50, 자기 교차 없음.
        start: {type: string, format: date}
        end: {type: string, format: date}
        freq: {type: string, enum: [month, day], default: month}
    Hotspot:
      type: object
      additionalProperties: false
      description: 핸드오프 §1-1 열 19개, 같은 순서. release 에 점 파일이 없다(R2). HotspotList 예시는 가짜 생성기 값(API-v3 §3.2).
      x-status: release-absent
      required: [latitude, longitude, acq_datetime_utc, date_local, satellite, instrument, frp, confidence, daynight, cell_id, country, adm1, harmonized_weight, weight_lo, weight_hi, weight_source, is_reference, source, method_version]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        acq_datetime_utc: {type: string, format: date-time}
        date_local: {type: string, format: date, description: 현지 태양시 날짜(필터 기준)}
        satellite: {type: string, enum: [N, N20, N21, Terra, Aqua]}
        instrument: {type: string, enum: [VIIRS, MODIS]}
        frp: {type: [number, 'null']}
        confidence: {type: string, enum: [l, n, h]}
        daynight: {type: string, enum: [D, N]}
        cell_id: {$ref: '#/components/schemas/CellId'}
        country: {type: [string, 'null'], description: ISO3 (가정 G9)}
        adm1: {type: [string, 'null']}
        harmonized_weight: {type: number, minimum: 0}
        weight_lo: {type: [number, 'null'], minimum: 0}
        weight_hi: {type: [number, 'null'], minimum: 0}
        weight_source: {$ref: '#/components/schemas/ValueSource'}
        is_reference: {type: boolean}
        source: {$ref: '#/components/schemas/DataSource'}
        method_version: {$ref: '#/components/schemas/MethodVersion'}
    HotspotList:
      type: object
      additionalProperties: false
      required: [start, end, layer, limit, count, truncated, reference_sum, hotspots, method_version]
      properties:
        aoi_id: {$ref: '#/components/schemas/AoiId'}
        bbox: {$ref: '#/components/schemas/Bbox'}
        start: {type: string, format: date}
        end: {type: string, format: date}
        layer: {type: string, enum: [reference, all]}
        limit: {type: integer}
        count: {type: integer}
        total: {type: integer}
        truncated: {type: boolean}
        next_cursor: {type: [string, 'null']}
        unit: {$ref: '#/components/schemas/Unit'}
        reference_sum:
          type: object
          description: limit 와 무관하게 조건에 맞는 is_reference=true 점 전체 합
          properties:
            value: {type: number}
            value_lo: {type: [number, 'null']}
            value_hi: {type: [number, 'null']}
            n_points: {type: integer}
        hotspots:
          type: array
          items: {$ref: '#/components/schemas/Hotspot'}
        method_version: {$ref: '#/components/schemas/MethodVersion'}
      examples:
        - start: '2025-03-22'
          end: '2025-03-23'
          aoi_id: SGG_47170
          layer: reference
          limit: 1
          count: 1
          total: 9
          truncated: true
          reference_sum: {value: 9.0, value_lo: 9.0, value_hi: 9.0, n_points: 9}
          hotspots:
            - {latitude: 36.6536, longitude: 128.61977, acq_datetime_utc: '2025-03-21T16:43:00Z', date_local: '2025-03-22', satellite: N, instrument: VIIRS, frp: 0.9, confidence: n, daynight: N, cell_id: 4560686, country: KOR, adm1: SIDO_47, harmonized_weight: 1.0, weight_lo: 1.0, weight_hi: 1.0, weight_source: snpp_observed, is_reference: true, source: SP, method_version: v1-m2v-fake-2026-11-14}
          method_version: v1-m2v-fake-2026-11-14
    CellId:
      type: integer
      minimum: 0
      description: |
        `cell_id = (floor(cell_lat×10)+900)×3600 + (floor(cell_lon×10)+1800)`, 칸 중심 = 모서리 + 0.05.
        release 51,562,642행 전부에서 불일치 0 (INSPECT 가 잼). 예 4549889 → 모서리 (36.3, 128.9).
    CellProperties:
      type: object
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/Interval'
        - $ref: '#/components/schemas/EventColumns'
      required: [cell_id, value, value_lo, value_hi, raw_modis, raw_viirs, value_source, data_source, status]
      properties:
        cell_id: {$ref: '#/components/schemas/CellId'}
        cell_lat: {type: number, description: 칸 중심 위도(정본은 싣는다; 시제품 v3 는 geometry 로만)}
        cell_lon: {type: number}
        raw_modis: {type: [integer, 'null'], minimum: 0}
        raw_viirs: {type: [integer, 'null'], minimum: 0}
        value_source: {$ref: '#/components/schemas/ValueSource'}
        data_source: {$ref: '#/components/schemas/DataSource'}
        status: {$ref: '#/components/schemas/MonthStatus'}
    CellFeature:
      type: object
      additionalProperties: false
      required: [type, id, geometry, properties]
      properties:
        type: {const: Feature}
        id: {$ref: '#/components/schemas/CellId'}
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type: {const: Polygon}
            coordinates: {type: array}
        properties: {$ref: '#/components/schemas/CellProperties'}
    CellCollection:
      type: object
      additionalProperties: false
      required: [type, properties, features]
      properties:
        type: {const: FeatureCollection}
        properties:
          type: object
          additionalProperties: false
          required: [year, month, unit, month_status, method_version]
          properties:
            aoi_id: {$ref: '#/components/schemas/AoiId'}
            bbox: {$ref: '#/components/schemas/Bbox'}
            year: {type: integer}
            month: {type: integer, minimum: 1, maximum: 12}
            unit: {$ref: '#/components/schemas/Unit'}
            cell_size_deg: {const: 0.1}
            n_cells: {type: integer}
            month_status: {$ref: '#/components/schemas/MonthStatus'}
            zero_rule: {type: string}
            method_version: {$ref: '#/components/schemas/MethodVersion'}
        features:
          type: array
          items: {$ref: '#/components/schemas/CellFeature'}
      examples:
        - type: FeatureCollection
          properties: {aoi_id: SGG_47170, year: 2025, month: 3, unit: VIIRS(S-NPP) 기준 화재 감지량, cell_size_deg: 0.1, n_cells: 8, month_status: ok, zero_rule: a cell without a feature is 0 (see month_status for missing), method_version: v1-m2v-2026-11-14}
          features:
            - type: Feature
              id: 4549889
              geometry: {type: Polygon, coordinates: [[[128.9, 36.3], [129.0, 36.3], [129.0, 36.4], [128.9, 36.4], [128.9, 36.3]]]}
              properties: {cell_id: 4549889, value: 107.0, value_lo: 107.0, value_hi: 107.0, raw_modis: 29, raw_viirs: 107, value_source: snpp_observed, data_source: SP, status: ok}
    SatelliteStatus:
      type: object
      additionalProperties: false
      description: v1.2 release 파일 모양(앞선 가정 G1 모양은 버림).
      required: [freq, days, months, data_release]
      properties:
        start: {type: [string, 'null'], format: date}
        end: {type: [string, 'null'], format: date}
        freq: {type: string, enum: [day, month]}
        through: {type: [string, 'null'], format: date, description: 파일의 마지막 date_utc}
        days:
          type: array
          maxItems: 2196
          items: {$ref: '#/components/schemas/SatelliteDayStatus'}
        months:
          type: array
          items: {$ref: '#/components/schemas/SatelliteMonthStatus'}
        method_version: {$ref: '#/components/schemas/MethodVersion'}
        data_release: {$ref: '#/components/schemas/DataRelease'}
    Method:
      type: object
      required: [method_version, unit, meta]
      properties:
        method_version: {$ref: '#/components/schemas/MethodVersion'}
        unit: {$ref: '#/components/schemas/Unit'}
        unit_code: {const: snpp_equiv_hotspots}
        meta:
          type: object
          description: m2v_meta.json 그대로(키 자유, method_version 만 필수 — G11). release meta 의 `regional_only` 문구는 파일 내용과 다르다(R12).
          required: [method_version]
        value_sources: {type: array}
        statuses: {type: array, items: {type: string}}
        verdict_rule: {type: object}
        rules: {type: array}
        sources:
          type: array
          description: 출처 표시(FIRMS 인정 문구·경계 CC BY)
          items: {type: object}
        data_version: {type: string}
        display_names:
          type: object
          description: 'v1.2 — 화면 표시 이름(내부 id → 이름). info.x-display-names 와 같다.'
          additionalProperties: {type: string}
        performance_copy: {type: string, description: '「총량 오차 1~2%, 월별 상관 0.97」 (모델팀 발표·화면 문구)'}
        files: {type: object}
        ingest:
          type: object
          properties:
            loaded_at: {type: string}
            aliases_used: {type: array, items: {type: string}}
            warnings: {type: array, items: {type: string}}
    Version:
      type: object
      required: [api_version, method_version, data_version, limits]
      properties:
        api_version: {const: v1}
        method_version: {$ref: '#/components/schemas/MethodVersion'}
        data_version: {type: string}
        release: {type: string, examples: [data-v1-m2v-2026-11-14]}
        limits:
          type: object
          properties:
            hotspots_days_reference: {type: integer, examples: [92]}
            hotspots_days_all: {type: integer, examples: [31]}
            hotspots_limit_max: {type: integer, examples: [10000]}
            summary_day_days: {type: integer, examples: [366]}
            summary_month_years: {type: integer, examples: [40]}
            calendar_years: {type: integer, examples: [40]}
            polygon_vertices: {type: integer, examples: [5000]}
            cells_max: {type: integer, examples: [10000]}
            csv_rows: {type: integer, examples: [100000]}
            fire_events_limit_max: {type: integer, examples: [1000]}
            fire_events_days: {type: integer, examples: [3700]}
            layer_bbox_area_deg2: {type: number, examples: [400]}
            frp_rows: {type: integer, examples: [50000]}
            frp_day_days: {type: integer, examples: [31]}
            frp_month_months: {type: integer, examples: [24]}
            frp_bbox_area_deg2: {type: number, examples: [100]}
            fwi_series_days: {type: integer, examples: [366]}
            status_day_days: {type: integer, examples: [366]}
            spread_cells_max: {type: integer, examples: [20000]}
    ErrorCode:
      type: string
      description: 문자열 code (프런트 분기용). 여러 번호가 같은 code 를 공유한다.
      enum: [invalid_param, method_not_allowed, not_acceptable, range_too_large, rate_limited, not_found, unknown_aoi, polygon_too_complex, cursor_stale, release_hash_mismatch, conflict, data_not_loaded, upstream_error, upstream_unavailable, unauthorized, forbidden, csrf_rejected, login_failed, internal, overloaded]
    ErrorNo:
      type: integer
      description: |
        `DSSNN` — D 대역(1 공통 · 2 catalog · 3 harmonized · 4 observation · 5 ingest·provenance · 6 external · 7 identity · 8 reporting · 9 내부),
        SS 종류(00 형식 · 01 범위·비용 · 02 상태·충돌 · 03 인증·한도 · 04 없음 · 05 저장소·상류 · 09 내부), NN 일련번호.
        번호 재사용 금지. 표는 `x-error-catalog` (arch2 ARCHITECTURE §3.9).
      minimum: 10000
      maximum: 99999
      x-error-catalog:
        - {'no': 10001, name: INVALID_PARAM, code: invalid_param, http: 400}
        - {'no': 10002, name: METHOD_NOT_ALLOWED, code: method_not_allowed, http: 405}
        - {'no': 10003, name: NOT_ACCEPTABLE, code: not_acceptable, http: 406}
        - {'no': 10004, name: UNSUPPORTED_MEDIA_TYPE, code: invalid_param, http: 415}
        - {'no': 10101, name: QUERY_TOO_LONG, code: range_too_large, http: 400}
        - {'no': 10102, name: BODY_TOO_LARGE, code: range_too_large, http: 413}
        - {'no': 10301, name: RATE_LIMITED, code: rate_limited, http: 429}
        - {'no': 10401, name: ROUTE_NOT_FOUND, code: not_found, http: 404}
        - {'no': 20401, name: UNKNOWN_AOI, code: unknown_aoi, http: 404}
        - {'no': 30101, name: CALENDAR_RANGE_TOO_LARGE, code: range_too_large, http: 400}
        - {'no': 30102, name: CSV_ROWS_TOO_MANY, code: range_too_large, http: 400}
        - {'no': 40001, name: INVALID_GEOMETRY, code: invalid_param, http: 400}
        - {'no': 40101, name: OBSERVATION_RANGE_TOO_LARGE, code: range_too_large, http: 400}
        - {'no': 40102, name: POLYGON_TOO_COMPLEX, code: polygon_too_complex, http: 400}
        - {'no': 40103, name: CELLS_TOO_MANY, code: range_too_large, http: 400}
        - {'no': 40201, name: CURSOR_STALE, code: cursor_stale, http: 409}
        - {'no': 40002, name: INVALID_EVENT_ID, code: invalid_param, http: 400}
        - {'no': 40003, name: AOI_AND_BBOX, code: invalid_param, http: 400}
        - {'no': 40004, name: DATE_AND_RANGE, code: invalid_param, http: 400}
        - {'no': 40005, name: INVALID_FORECAST_PERIOD, code: invalid_param, http: 400}
        - {'no': 40104, name: FRP_RANGE_TOO_LARGE, code: range_too_large, http: 400}
        - {'no': 40105, name: BBOX_AREA_TOO_LARGE, code: range_too_large, http: 400}
        - {'no': 40106, name: EVENTS_RANGE_TOO_LARGE, code: range_too_large, http: 400}
        - {'no': 40107, name: SERIES_RANGE_TOO_LARGE, code: range_too_large, http: 400}
        - {'no': 40108, name: FORECAST_RANGE_TOO_LARGE, code: range_too_large, http: 400}
        - {'no': 40402, name: UNKNOWN_FIRE_EVENT, code: not_found, http: 404}
        - {'no': 50502, name: LAYER_NOT_LOADED, code: data_not_loaded, http: 503}
        - {'no': 50001, name: RELEASE_INVALID, code: invalid_param, http: null, cli_exit: 3}
        - {'no': 50002, name: RELEASE_HASH_MISMATCH, code: release_hash_mismatch, http: null, cli_exit: 4}
        - {'no': 50003, name: RELEASE_KEY_INVALID, code: invalid_param, http: null, cli_exit: 3}
        - {'no': 50201, name: RELEASE_STATE_CONFLICT, code: conflict, http: 409, cli_exit: 5}
        - {'no': 50501, name: DATA_NOT_LOADED, code: data_not_loaded, http: 503}
        - {'no': 60501, name: UPSTREAM_ERROR, code: upstream_error, http: 502}
        - {'no': 60502, name: UPSTREAM_UNAVAILABLE, code: upstream_unavailable, http: 503}
        - {'no': 70301, name: UNAUTHORIZED, code: unauthorized, http: 401}
        - {'no': 70302, name: FORBIDDEN, code: forbidden, http: 403}
        - {'no': 70303, name: CSRF_REJECTED, code: csrf_rejected, http: 403}
        - {'no': 70304, name: LOGIN_FAILED, code: login_failed, http: 401}
        - {'no': 80401, name: NOT_FOUND, code: not_found, http: 404}
        - {'no': 80201, name: IDEMPOTENCY_CONFLICT, code: conflict, http: 409}
        - {'no': 80202, name: PRECONDITION_FAILED, code: conflict, http: 412}
        - {'no': 90901, name: INTERNAL, code: internal, http: 500}
        - {'no': 90902, name: OVERLOADED, code: overloaded, http: 503}
    Problem:
      type: object
      description: RFC 9457 problem+json. detail 에 경로·스택·키·SQL 을 넣지 않는다. 500 은 request_id 만.
      required: [type, title, status, code, error_no, request_id]
      properties:
        type: {type: string, format: uri, description: '${emberline.errors.type-base}/<code>'}
        title: {type: string, description: ko/en (Accept-Language)}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, description: 요청 경로(쿼리 제외)}
        code: {$ref: '#/components/schemas/ErrorCode'}
        error_no: {$ref: '#/components/schemas/ErrorNo'}
        param: {type: string, description: 어느 파라미터인지(입력 오류)}
        request_id: {type: string}
        method_version: {$ref: '#/components/schemas/MethodVersion'}
        errors:
          type: array
          description: 검증 오류 여럿
          items:
            type: object
            properties:
              param: {type: string}
              detail: {type: string}
    DataRelease:
      type: string
      description: 적재한 모델 release 태그. v1.1 이하는 쓰지 않는다(F15).
      examples: [data-v1.2-2026-11-15]
    Coverage:
      type: object
      additionalProperties: false
      description: |
        「자료 없음」 표현(F15). 오류가 아니라 200 + 빈 배열/null 값 + 이 객체.
        화면은 `available=false` 일 때 「이 지역 자료 없음」 한 줄만 쓰고 가짜 값·0 을 그리지 않는다.
        `available=true` 인데 배열이 비면 「자료는 있으나 해당 없음」(예 오늘 감지 없음)이다 — 둘을 섞지 않는다.
      required: [available, scope, reason]
      properties:
        available: {type: boolean}
        scope:
          type: string
          description: 그 층이 자료를 가진 범위
          enum: [world_land_detected, kr_sgg, kr_arg_events, kr_arg_fwi, kr_box_arg_spread, kr_arg_regime, world_frp]
        reason:
          type: [string, 'null']
          enum: [out_of_coverage, no_cells, not_sgg_level, null]
          description: available=false 일 때만. not_sgg_level 은 쓰지 않고 grid_summary 로 답한다(예약).
        regions:
          type: array
          items: {type: string, enum: [WORLD, KR, KR_BOX, ARG]}
    VsNormal:
      type: string
      enum: [higher, similar, lower]
      description: '`p_any − baseline_p` ≥ +0.10 → higher, ≤ −0.10 → lower, 그 사이 similar (모델팀 표시 규칙). 화면 문구 「예년보다 높음 / 예년 수준 / 예년보다 낮음」.'
    GridOccurrenceCell:
      type: object
      additionalProperties: false
      description: '`fields=map` 이면 required 7필드만, `full` 이면 전부(파일 값은 결측 0 — 잼).'
      required: [cell_id, lat, lon, p_any, baseline_p, vs_normal, persistent_source]
      properties:
        cell_id: {type: integer, minimum: 0, description: '0.5° 격자 id = floor((lat+90)/0.5) × 720 + floor((lon+180)/0.5) (0.1° CellId 와 다른 체계, 52,855/52,855 일치 잼)'}
        lat: {type: number, description: 격자 중심}
        lon: {type: number}
        p_any: {type: number, minimum: 0, maximum: 1, description: 다음 달 기준 감지 ≥ 1건 확률(고정 열원 제외)}
        p_none: {type: number, minimum: 0, maximum: 1}
        baseline_p: {type: number, minimum: 0, maximum: 1, description: 예년 같은 달 발생 비율}
        vs_normal: {$ref: '#/components/schemas/VsNormal'}
        persistent_source: {type: boolean, description: 지속 열원 의심 → 회색, 순위·강조 제외}
        adm0: {type: [string, 'null'], description: ISO3}
        continent: {type: [string, 'null']}
        rate_5y: {type: [number, 'null']}
        lag1_projected: {type: [boolean, 'null'], description: 직전 달(진행 중) 월말 추정값을 특성으로 썼는지}
    GridOccurrence:
      type: object
      additionalProperties: false
      required: [target_month, as_of_date, model, cell_size_deg, count, cells, coverage, notice, data_release]
      properties:
        target_month: {$ref: '#/components/schemas/YearMonth'}
        as_of_date: {type: string, format: date}
        model: {type: string, examples: [grid_occurrence_xgb+isotonic, baseline_same_month_rate]}
        cell_size_deg: {const: 0.5}
        bbox: {$ref: '#/components/schemas/Bbox'}
        count: {type: integer, minimum: 0}
        cells:
          type: array
          items: {$ref: '#/components/schemas/GridOccurrenceCell'}
        coverage: {$ref: '#/components/schemas/Coverage'}
        notice: {type: string}
        data_release: {$ref: '#/components/schemas/DataRelease'}
    GridSummary:
      type: object
      additionalProperties: false
      description: AOI 안 0.5° 격자(칸 중심 기준) 요약. 지역 확률이 아니다.
      required: [n_cells, n_persistent, bands, p_any_max, p_any_median]
      properties:
        n_cells: {type: integer, minimum: 0}
        n_persistent: {type: integer, minimum: 0}
        bands:
          type: object
          additionalProperties: false
          description: 지속 열원 뺀 칸 수
          properties:
            lt10: {type: integer}
            p10_40: {type: integer}
            p40_70: {type: integer}
            ge70: {type: integer}
        p_any_max: {type: [number, 'null']}
        p_any_median: {type: [number, 'null']}
        top_cells:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/GridOccurrenceCell'}
    AoiOccurrence:
      type: object
      additionalProperties: false
      required: [aoi_id, unit, target_month, as_of_date, model, p_any, p_none, baseline_p, vs_normal, suspected_industrial, grid_summary, coverage, notice, data_release]
      properties:
        aoi_id: {$ref: '#/components/schemas/AoiId'}
        name_ko: {type: [string, 'null'], x-release-column: aoi_list.name}
        unit: {type: string, enum: [aoi, grid_summary]}
        target_month: {oneOf: [{$ref: '#/components/schemas/YearMonth'}, {type: 'null'}]}
        as_of_date: {type: [string, 'null'], format: date}
        model: {type: [string, 'null']}
        p_any: {type: [number, 'null'], minimum: 0, maximum: 1}
        p_none: {type: [number, 'null'], minimum: 0, maximum: 1}
        baseline_p: {type: [number, 'null'], minimum: 0, maximum: 1}
        vs_normal: {oneOf: [{$ref: '#/components/schemas/VsNormal'}, {type: 'null'}]}
        suspected_industrial: {type: [boolean, 'null'], description: 산업 열원 의심(4곳) → 회색, 순위·강조·알림 제외, 값은 상세에서만}
