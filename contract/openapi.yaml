        expected_fire_days: {type: number, minimum: 0}
        definition: {type: string}
    Forecast:
      type: object
      description: 모델 함수 반환값. 아래에 없는 필드가 더 와도 화면은 무시한다(모델팀 실험 기능 — 필드가 늘 수 있음).
