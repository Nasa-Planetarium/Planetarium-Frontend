openapi: 3.1.0
info:
  title: EMBERLINE API
  version: 1.0.0-draft.1
  summary: VIIRS(S-NPP) 기준 화재 감지량 — 모델 release 를 읽어 지도·캘린더·예년 비교·CSV 를 낸다
  description: |
    계약 정본(contract-first, arch2 S8 권장 · critique D1 해소). 작성 2026-11-14.

    정본 순서 (00-decisions A2 · arch2 X9):
    1. 모델팀 확정본 `docs/api_contract.md` (아직 없음 — 오면 그쪽 열 이름이 이긴다)
    2. 모델팀 초안 `product/backend-handoff.md` (경로·파라미터 이름·코드값·열 이름)
    3. release `data-v1-m2v-2026-11-14` 실사실 (`data/release-inspect/INSPECT.md` 가 잰 것)
    4. 이 파일 (경로 모양 = arch2 `/api/v1` 자원 명사, 응답 본문 = API-v3 + release)

    읽는 법
    - 정본 경로는 `/api/v1/...`. 핸드오프 8경로와 확장 2경로는 각 operation 의 `x-handoff-alias` 에 원래 경로·파라미터 이름을 적었다.
      별칭은 `/api/<핸드오프 경로>` 로 서비스하고 본문은 정본과 같다(헤더 `Link: <정본>; rel="canonical"` 만 더함, `Deprecation` 없음 — arch2 S5).
    - 응답 필드 이름 = 핸드오프 열 이름(snake_case). release 에서 이름이 다른 열은 `x-release-column` 에 적었다(적재기가 번역).
    - 숫자는 파일 값 그대로 낸다(A1 「모델 따른다」). verdict·percentile 을 다시 계산하지 않는다.
    - `x-status: assumed` = release 에 없어서 가정으로 둔 모양. `x-status: release-absent` = 이 release 로는 503.
    - 예시 숫자는 release 실값(팀 시험 서버의 시제품가 release 를 읽어 2026-11-14 19:12 KST 에 낸 응답에서 옮김). 점(`/hotspots`)·위성 상태는 release 에 없어 가짜 예시이며 그렇게 표시했다.

    알려진 결함·열린 것: `contract/ASSUMPTIONS.md`, `CONFLICTS.md`. 대응표: `contract/MAPPING.md`.

    F17 갱신 (2026-11-15): `POST /forecast` (FireOutlook Planner 30일 전망, 태그 outlook) — 모델팀 계약 절 그대로. 본문·꼭짓점·horizon 한도는 우리가 정함(x-status assumed).

    v1.2 갱신 (2026-11-15, F15)
    - 정본 데이터 = release `data-v1.2-2026-11-15`(모델팀 확정, v1.1 쓰지 않음). method_version 은 그대로 `v1-m2v-2026-11-14`(FireBridge 재학습 없음).
    - 모델팀 확정 계약 = `product/team/v1.2/api_contract.md`(sha256 9e3c8292…, 팀 서버 사본과 같음을 잼). 파라미터 이름은 그쪽을 따르고 별칭(`x-handoff-alias`)으로 받는다.
    - 새 경로(태그 outlook·fire-info, 그리고 `/cells/frp`): 아래 operation 의 `x-release-file` 이 읽는 파일.
    - 「자료 없음」은 오류가 아니다: 200 + 빈 배열/null + `coverage.available=false` (스키마 `Coverage`). 화면은 「이 지역 자료 없음」 한 줄.
    - 앞선 경로들의 예시 숫자는 v1 값이다(예 KR 2025-03 2,764 → v1.2 는 2,731, 고정 열원 제외). 새 경로 예시는 v1.2 실값(2026-11-15 팀 시험 서버에서 파일을 읽어 옮김, 소수 5자리 안팎 반올림).
  license:
    name: 내부 초안 (Team Planetarium)
    identifier: LicenseRef-Planetarium-Internal
  x-data-release: data-v1.2-2026-11-15
  x-data-release-history: [data-v1-m2v-2026-11-14, data-v1.1-m2v-2026-11-14, data-v1.2-2026-11-15]
  x-method-version: v1-m2v-2026-11-14
  x-display-names:
    description: 화면 표시 이름만. 코드·파일·응답 값은 내부 id 그대로(F15, 모델팀 v1.2 노트).
    m2v_xgb: FireBridge (MODIS-to-VIIRS Harmonizer)
    m2v_xgb_terra: FireBridge-Terra
    m2v_q10_q90: FireBridge Uncertainty Band
    n20_bridge: N20 Bridge
    performance_copy: 총량 오차 1~2%, 월별 상관 0.97
servers:
  - url: /api/v1
    description: 정본. 핸드오프 별칭은 /api/<경로> (각 operation 의 x-handoff-alias)
tags:
  - name: catalog
    description: 지역(AOI) 목록·경계
  - name: harmonized
    description: aoi_month · aoi_month_compare (지역×월, 캘린더·비교)
  - name: observation
    description: 점·칸·임의 영역 합계
  - name: provenance
    description: 방법·판·위성 상태
  - name: external
    description: FIRMS 대리
  - name: outlook
    description: 다음 달 열원 발생 확률(모델팀, F15 예측 화면 — 우리 A안 전망 대체)
  - name: fire-info
    description: v1.2 새 층 — 화재 사건·연소 면적·FWI·확산 nowcast·불 유형 (대부분 한국·아르헨티나)
x-header-sets:
  cached: &cached
    ETag:
      $ref: '#/components/headers/ETag'
    Cache-Control:
      $ref: '#/components/headers/CacheControlData'
    X-Method-Version:
      $ref: '#/components/headers/XMethodVersion'
    X-Data-Version:
      $ref: '#/components/headers/XDataVersion'
    Vary:
      $ref: '#/components/headers/Vary'
  layer_cached: &layer_cached
    ETag:
      $ref: '#/components/headers/ETag'
    Cache-Control:
      $ref: '#/components/headers/CacheControlLayer'
    X-Method-Version:
      $ref: '#/components/headers/XMethodVersion'
    X-Data-Version:
      $ref: '#/components/headers/XDataVersion'
    Vary:
      $ref: '#/components/headers/Vary'
paths:
  /aois:
    get:
      tags: [catalog]
      operationId: listAois
      summary: 지역 목록
      description: |
        `hidden=true` 행(예 `CONT_Seven_seas__open_ocean`, adm1 54개, country 8개)은 기본 숨김.
        경계는 목록에 싣지 않고 `/aois/{aoiId}/boundary` 로 받는다(`include_geometry` 는 별칭에서만).
      x-handoff-alias:
        path: /aoi
        served_at: /api/aoi
        params:
          level: level
          parent_id: parent_id
          q: q
          include_geometry: "(별칭 전용) true 면 각 항목에 geometry. parent_id 없이 true 면 400 invalid_param"
        alias_only_params: [include_geometry]
      parameters:
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/ParentId'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/IncludeHidden'
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 지역 목록
          headers: *cached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AoiList'
              examples:
                kr_sido:
                  summary: GET /aois?level=kr_sido (release 실값, 1개만)
                  value:
                    method_version: v1-m2v-2026-11-14
                    unit: VIIRS(S-NPP) 기준 화재 감지량
                    count: 17
                    next_cursor: null
                    aois:
                      - aoi_id: SIDO_11
                        name_ko: 서울특별시
                        name_en: null
                        level: kr_sido
                        parent_id: KR
                        n_cells: 15
                        hidden: false
                        has_data: true
                        first_month: '2000-11'
                        last_month: '2026-11'
                        bbox: [126.765, 37.43, 127.184, 37.701]
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /aois/{aoiId}:
    get:
      tags: [catalog]
      operationId: getAoi
      summary: 지역 하나
      x-handoff-alias: null
      parameters:
        - $ref: '#/components/parameters/AoiIdPath'
      responses:
        '200':
          description: 지역
          headers: *cached
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Aoi'
                  - type: object
                    required: [method_version]
                    properties:
                      method_version:
                        $ref: '#/components/schemas/MethodVersion'
              examples:
                kr:
                  summary: GET /aois/KR (release 실값)
                  value:
                    aoi_id: KR
                    name_ko: 대한민국
                    name_en: null
                    level: country
                    parent_id: CONT_Asia
                    n_cells: 1123
                    hidden: false
                    has_data: true
                    first_month: '2000-11'
                    last_month: '2026-11'
                    bbox: [124.614, 33.198, 130.921, 38.624]
                    method_version: v1-m2v-2026-11-14
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /aois/{aoiId}/boundary:
    get:
      tags: [catalog]
      operationId: getAoiBoundary
      summary: 지역 경계 (GeoJSON Feature)
      description: |
        release `aoi_boundaries.geojson` 피처 5,038개. 경계 없는 AOI 13개(`WORLD`, `CONT_*` 8개, `ADM1_BRI-00`·`BRT-00`·`CNM-00`·`SPI-00`)는 404 `unknown_aoi` 가 아니라 200 + `geometry: null`.
      x-handoff-alias:
        path: /aoi
        served_at: /api/aoi
        params:
          include_geometry: "true → 목록 항목마다 geometry (정본은 이 하위 자원)"
      parameters:
        - $ref: '#/components/parameters/AoiIdPath'
      responses:
        '200':
          description: 경계
          headers: *cached
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/BoundaryFeature'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /aois/{aoiId}/calendar:
    get:
      tags: [harmonized]
      operationId: getCalendar
      summary: 연×월 캘린더 (aoi_month + aoi_month_compare)
      description: |
        요청한 해의 1–12월을 모두 준다. 파일에 행이 없는 달(2000-11 이전, 2026-11 이후)은 `status: out_of_range`, 값 null.
        결측 달(release: 2001-06 전 AOI 5,051행)은 `status: missing`, `value: null` — 0 으로 칠하지 않는다.
        CSV 는 `Accept: text/csv` 또는 `format=csv` (핸드오프 `/export.csv?type=calendar`).
      x-handoff-alias:
        path: /calendar
        served_at: /api/calendar
        params:
          aoi_id: "path {aoiId}"
          start_year: start_year
          end_year: end_year
        csv_alias:
          path: /export.csv
          served_at: /api/export.csv
          params:
            type: calendar
            aoi_id: "path {aoiId}"
            start_year: start_year
            end_year: end_year
      parameters:
        - $ref: '#/components/parameters/AoiIdPath'
        - $ref: '#/components/parameters/StartYear'
        - $ref: '#/components/parameters/EndYear'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: 캘린더
          headers: *cached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
              examples:
                kr_2025_03:
                  summary: GET /aois/KR/calendar?start_year=2025&end_year=2025 (release 실값, 3월만 남김)
                  value:
                    aoi_id: KR
                    method_version: v1-m2v-2026-11-14
                    unit: VIIRS(S-NPP) 기준 화재 감지량
                    start_year: 2025
                    end_year: 2025
                    event_columns: []
                    months:
                      - year: 2025
                        month: 3
                        value: 2764.0
                        value_lo: 2764.0
                        value_hi: 2764.0
                        raw_modis: 772
                        raw_viirs: 2764
                        value_source: snpp_observed
                        data_source: SP
                        status: ok
                        n_cells: 1123
                        verdict: above
                        percentile: 100.0
                        ratio_to_median: 10.924901185770752
                        low_sample: false
                        missing_dates: []
                        days_covered: null
                kr_2001_06_missing:
                  summary: KR 2001-06 결측 달 (release 실값 — value null, percentile 은 파일의 0.0 그대로)
                  value:
                    aoi_id: KR
                    method_version: v1-m2v-2026-11-14
                    unit: VIIRS(S-NPP) 기준 화재 감지량
                    start_year: 2001
                    end_year: 2001
                    event_columns: []
                    months:
                      - year: 2001
                        month: 6
                        value: null
                        value_lo: null
                        value_hi: null
                        raw_modis: 11
                        raw_viirs: null
                        value_source: modis_m2v_terra
                        data_source: SP
                        status: missing
                        n_cells: 1123
                        verdict: uncertain
                        percentile: 0.0
                        ratio_to_median: null
                        low_sample: false
                        missing_dates: []
                        days_covered: null
            text/csv:
              schema:
                type: string
                x-csv-columns: [aoi_id, year, month, value, value_lo, value_hi, raw_modis, raw_viirs, value_source, data_source, status, verdict, percentile, ratio_to_median, n_cells, missing_dates, method_version]
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /aois/{aoiId}/months/{yearMonth}/comparison:
    get:
      tags: [harmonized]
      operationId: getComparison
      summary: 그 달 예년 대비 상세
      description: |
        `value`~`verdict` 8개와 `low_sample` = `aoi_month_compare` 행 그대로. 판정을 다시 하지 않는다.
        release 에서 `low_sample=true` 인데 `verdict=above` 인 행 5,250개(팀 `analysis.py`: low_sample 이어도 값≥3 → above),
        그 중 `percentile<80` 인데 above 2개(`ADM1_AZE-1699` 2022-11, `ADM1_IRL-5572` 2011-03) — 파일 값 그대로 낸다.
      x-handoff-alias:
        path: /compare
        served_at: /api/compare
        params:
          aoi_id: "path {aoiId}"
          year: "path {yearMonth} 의 YYYY"
          month: "path {yearMonth} 의 MM (1–12, 앞 0 없이도 받음)"
      parameters:
        - $ref: '#/components/parameters/AoiIdPath'
        - name: yearMonth
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/YearMonth'
          example: '2025-03'
      responses:
        '200':
          description: 비교
          headers: *cached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comparison'
              examples:
                sido47_2025_03:
                  summary: GET /aois/SIDO_47/months/2025-03/comparison (release 실값, baseline 2개만)
                  value:
                    aoi_id: SIDO_47
                    year: 2025
                    month: 3
                    unit: VIIRS(S-NPP) 기준 화재 감지량
                    value: 2352.951315802467
                    baseline_median: 21.559882271010604
                    baseline_p25: 16.036174767574185
                    baseline_p75: 25.85789001970508
                    percentile: 100.0
                    ratio_to_median: 109.13562913867312
                    n_baseline_years: 24
                    verdict: above
                    status: ok
                    value_source: snpp_observed
                    value_lo: 2352.951315802467
                    value_hi: 2352.951315802467
                    low_sample: false
                    baseline:
                      - {year: 2001, value: 40.23266474696909, status: ok, value_source: modis_m2v_terra, used: true}
                      - {year: 2002, value: 23.550687716947095, status: ok, value_source: modis_m2v_terra, used: true}
                    rule:
                      id: pct-80-20/n10/ok-only
                      above_if_percentile_ge: 80
                      below_if_percentile_le: 20
                      uncertain_if_years_lt: 10
                    method_version: v1-m2v-2026-11-14
                low_sample_above:
                  summary: low_sample=true 인데 above (release 실값 — 파일 그대로)
                  value:
                    aoi_id: ADM1_AZE-1699
                    year: 2022
                    month: 11
                    unit: VIIRS(S-NPP) 기준 화재 감지량
                    value: 3.118005613289087
                    baseline_median: 0.5370512356455552
                    baseline_p25: 0.10152890663579717
                    baseline_p75: 0.8580233503968905
                    percentile: 79.16666666666666
                    ratio_to_median: 5.805787988814755
                    n_baseline_years: 24
                    verdict: above
                    status: ok
                    value_source: snpp_observed
                    value_lo: 3.118005613289087
                    value_hi: 3.118005613289087
                    low_sample: true
                    baseline: []
                    rule: {id: pct-80-20/n10/ok-only}
                    method_version: v1-m2v-2026-11-14
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /aois/{aoiId}/summary:
    get:
      tags: [harmonized, observation]
      operationId: getAoiSummary
      summary: 지역의 기간별 합계
      description: |
        `freq=month` 이고 달 전체가 기간 안이면 `aoi_month` 행 그대로(`basis: aoi_month`).
        그 밖(일 단위, 달을 자르는 기간)은 `harmonized_hotspots` 기준 점 합(`basis: hotspots`) — release 에 점 파일이 없어 지금은 503 `data_not_loaded`.
        지역 합계는 `aoi_month` 만 쓴다: `/cells` 를 잘라 더한 값과 다르다(면적 무게 소속 — R13: KR VIIRS 기간 +11.8 %, MODIS 기간 +57.1 %).
      x-handoff-alias:
        path: /summary
        served_at: /api/summary
        params:
          aoi_id: "path {aoiId}"
          start: start
          end: end
          freq: freq
        csv_alias:
          path: /export.csv
          served_at: /api/export.csv
          params: {type: summary}
      parameters:
        - $ref: '#/components/parameters/AoiIdPath'
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/Freq'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          $ref: '#/components/responses/SummaryOk'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /summaries:
    get:
      tags: [observation]
      operationId: getBboxSummary
      summary: bbox 기간별 합계 (점 재집계)
      x-status: release-absent
      x-handoff-alias:
        path: /summary
        served_at: /api/summary
        params:
          bbox: bbox
          start: start
          end: end
          freq: freq
      parameters:
        - $ref: '#/components/parameters/BboxRequired'
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/Freq'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          $ref: '#/components/responses/SummaryOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /summary-queries:
    post:
      tags: [observation]
      operationId: querySummaryByPolygon
      summary: polygon 기간별 합계 (점 재집계, 큰 polygon 은 본문으로)
      description: 검색 자원(arch2 S6). 본문 ≤ 256 KB, 넘으면 413. 꼭짓점 > 5,000 또는 링 > 50 이면 400 `polygon_too_complex`.
      x-status: release-absent
      x-handoff-alias:
        path: /summary
        served_at: /api/summary
        params:
