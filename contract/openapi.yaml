  /spread-nowcast:
    get:
      tags: [fire-info]
      operationId: getSpreadNowcast
      summary: 내일 확산 가능성 nowcast (0.025° 후보 칸, 한국 상자·아르헨티나)
      description: |
        `spread_nowcast_latest.parquet`(10,189칸 = KR 147 · ARG 10,042, 기준일 2026-11-13 → 목표 2026-11-14, 모델 v1.2-ops 기상 없음, 2026-11-15 잼).
        - 칸 = 오늘 활성 칸 + 반경 3칸(≈7.5 km) 후보만. **파일에 없는 칸 = 「대상 아님」(0% 아님).** 오늘 활성 칸 346 · 후보 9,843(잼).
        - 날짜(`as_of_date`·`target_date`)는 **현지 날짜**(모델팀 meta 「다음 현지 날짜」). 기준 위성 NOAA-20(S-NPP 는 11-02 정지).
        - `aoi_id` = 칸 중심이 AOI 경계 안, `bbox` = 칸 중심이 상자 안(모델팀). 둘 중 정확히 하나.
        - **`region=KR` 은 「한국 상자」라 일본 칸이 섞인다**(잼, 칸 중심의 나라 `cand_adm0`): KR 147 = KOR 98 · JPN 47 · null(바다) 2, ARG 10,042 = ARG 9,941 · PRY 39 · BRA 27 · URY 21 · BOL 14.
          `aoi_id=KR` 은 경계 안 98칸 이하만 나오고, 한국 근처 `bbox` 는 일본 칸도 낸다(모델 출력이라 그대로 그리고 `cand_adm0` 를 툴팁에 쓴다).
          모델 검증도 「한국 상자」(PR-AUC 0.147)와 「한국만」(0.210)을 따로 잰다 — 화면 성능 문구는 한국만 값.
        - coverage: AOI 는 `KR`·`SIDO_*`·`SGG_*`·`ADM0_ARG`·`ADM1_ARG-*` 만 범위 안. 일본·파라과이 등 이웃 AOI 는 칸이 일부 있어도 `available=false`(일부만 담김 — 「자료 없음」으로 둔다).
          bbox 는 범위 상자(KR `[124.5, 33.0, 132.0, 38.7]` 추론 · ARG `[-73.5, -55.2, -53.4, -21.5]`, `/fire-events` 와 같음)와 겹치면 범위 안. 지금 KR 칸의 실제 범위는 위도 33.19~36.11 · 경도 129.29~131.71(그날 불 위치일 뿐 상자 정의가 아님, 쟁점 F15-Q5).
        - `level`: `low` < 0.05 ≤ `moderate` ≤ 0.20 < `high` (모델팀 규칙을 서버가 붙임 — quickstart 코드 `> 0.20` high · `≥ 0.05` moderate 와 같음). 잰 분포 low 9,708 · moderate 338 · high 143. 확률 숫자는 툴팁에만.
        - 크기(잼): 전체 10,189칸 JSON 1.57 MB / gzip 0.13 MB.
        - 필수 문구 `notice` 를 범례에 항상.
        - 범위 밖 → 200 `cells: []` + `coverage.available=false`. 범위 안인데 후보 칸이 없음 → `cells: []` + `coverage.available=true`(「오늘 감지 없음」, 자료 없음과 다름).
      x-handoff-alias:
        path: /spread
        served_at: /api/spread
        params:
          aoi: "aoi_id (모델 api_contract 이름 aoi)"
          bbox: bbox
      x-release-file: spread_nowcast_latest.parquet
      parameters:
        - $ref: '#/components/parameters/AoiIdQuery'
        - $ref: '#/components/parameters/Bbox'
        - name: min_level
          in: query
          description: 확장. 이 단계 이상만.
          schema: {type: string, enum: [low, moderate, high], default: low}
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: 확산 가능성 칸
          headers: *layer_cached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpreadNowcast'
              examples:
                arg_top:
                  summary: GET /spread-nowcast?bbox=-62,-26.5,-61,-25.5 (release 실값 1칸만 남김)
                  value:
                    as_of_date: '2026-11-13'
                    target_date: '2026-11-14'
                    model: spread_nowcast_xgb v1.2-ops (2026-11-15) no_weather
                    source_satellite: NOAA-20
                    weather_available: false
                    weather_lag_days: null
                    bbox: [-62.0, -26.5, -61.0, -25.5]
                    count: 1
                    cells:
                      - {region: ARG, cand_adm0: ARG, cell_lat: -25.9125, cell_lon: -61.4625, cell_size_deg: 0.025, p_spread: 0.97484, level: high, active_today: true, fire_event_days: 1, n_det_today_7x7: 32}
                    coverage: {available: true, scope: kr_box_arg_spread, reason: null}
                    notice: 위성 감지 기반 단기 확산 가능성입니다. 물리 시뮬레이션이 아니며, 오늘 감지 지점에서 반경 약 7.5 km 밖으로 번지는 경우와 새로 발생하는 불은 예측 대상이 아닙니다.
                    data_release: data-v1.2-2026-11-15
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /aois/{aoiId}/fire-regime:
    get:
      tags: [fire-info]
