# 검사 — PR 과 main·release 에 올라온 커밋마다.
# 순서: 설치(lock 그대로) → 정적 검사(typecheck·eslint·steiger·check:isolation) → 빌드(http = 배포와 같은 것) + Pages 한도 검사.
# 테스트(vitest·e2e)는 로컬에서 돌리고 올린다. 작업 이름 check-build-e2e 는 release 보호 규칙이 이 이름을 쓸 수 있어 그대로 둔다.
# 액션은 커밋 SHA 로 고정(뒤 주석이 태그). 올릴 때는 태그와 SHA 를 같이 바꾼다.
name: ci

on:
  pull_request:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # 로컬 .env.local 은 커밋되지 않는다 — 빌드마다 아래에서 값을 직접 준다(process.env 가 .env 파일보다 우선)
  NEXT_PUBLIC_API_BASE: /api/v1

jobs:
  check-build-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm 판은 package.json 의 packageManager(pnpm@10.34.9)를 읽는다
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # engines: node >=22.18.0 — 팀 시험 서버 검증 판(24.21.0)과 같은 메이저
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: 설치(lock 그대로)
        run: pnpm install --frozen-lockfile

      # 테스트(vitest · Playwright e2e)는 CI 에서 돌리지 않는다 — 올리기 전에 로컬에서 `pnpm test` · `pnpm build && pnpm e2e`.
      - name: 정적 검사 (typecheck · eslint · steiger · check:isolation · check:leaks)
        run: pnpm typecheck && pnpm lint && pnpm steiger && pnpm check:isolation && pnpm check:leaks

      - name: 빌드 — http(배포와 같은 설정)
        run: pnpm build
        env:
          NEXT_PUBLIC_DATA_MODE: http

      - name: Pages 한도 · 모드 검사(http)
        run: node scripts/check-pages-out.mjs --dir out --mode http
